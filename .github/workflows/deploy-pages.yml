name: Deploy GitHub Pages

on:
  # Publish the application version for every reviewed main commit.
  # The previous path filter left Pages stale after auth/deploy-only changes.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Build frontend
        env:
          # vuxo.app is a custom-domain GitHub Pages site, so assets live at the domain root.
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: ${{ vars.VUXO_API_BASE_URL || 'https://api.vuxoapi.xyz' }}
        run: npm run build
      - name: Verify deployed version metadata
        run: node ../../scripts/verify-built-version.mjs
      - name: Verify Pages artifact, routes and MSAL redirect bridge
        run: node ../../scripts/verify-pages-artifact.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: https://vuxo.app
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
