name: One-time merged PR branch cleanup (#142)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-pr-branches.yml'
  pull_request:
    paths:
      - '.github/workflows/cleanup-merged-pr-branches.yml'
      - 'scripts/maintenance/prune-merged-pr-branches.mjs'
      - 'scripts/maintenance/prune-merged-pr-branches.test.mjs'
  workflow_dispatch:
    inputs:
      delete_eligible:
        description: "Delete only the 33 explicitly allowlisted merged PR heads"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merged-pr-branch-cleanup
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Test fail-closed pruning rules
        run: node --test scripts/maintenance/prune-merged-pr-branches.test.mjs
      - name: Dry-run against live GitHub PR and branch metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/maintenance/prune-merged-pr-branches.mjs --dry-run

  prune:
    if: github.repository == 'KeyserDSoze/Vuxo' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Prune exact merged PR heads if authorized
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRUNE_APPROVED: ${{ github.event_name == 'push' || inputs.delete_eligible }}
        run: |
          if [ "$PRUNE_APPROVED" = "true" ]; then
            node scripts/maintenance/prune-merged-pr-branches.mjs --apply
          else
            node scripts/maintenance/prune-merged-pr-branches.mjs --dry-run
          fi
