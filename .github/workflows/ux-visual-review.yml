name: UX visual review

on:
  workflow_dispatch:
  # Run automatically when this evidence pipeline changes; otherwise on demand.
  push:
    branches: [main]
    paths:
      - .github/workflows/ux-visual-review.yml
      - src/frontend/tests/ux-visual-review.spec.ts
      - src/frontend/tests/auth.spec.ts
      - src/frontend/src/pages/RefugePage.tsx
      - src/frontend/tests/refuge-command-dashboard.spec.ts
      - src/frontend/src/features/auth/authApi.ts
      - src/frontend/src/pages/AuthPage.tsx
      - src/frontend/src/components/game-deck.css
      - src/frontend/src/components/GameDeck.tsx
      - src/frontend/tests/game-deck.spec.ts
      - src/frontend/src/game/WorldArtwork.ts
      - src/frontend/src/game/WorldPortalArtwork.ts
      - src/frontend/src/game/WorldScene.ts
      - src/frontend/src/game/WorldRadar.tsx
      - src/frontend/tests/world-radar.spec.ts
      - src/frontend/src/game/WorldTerrainWindow.ts
      - src/frontend/tests/world-terrain-window.spec.ts
      - src/frontend/src/game/WorldCamera.ts
      - src/frontend/tests/world-camera.spec.ts
      - src/frontend/tests/world-portals.spec.ts
      - src/frontend/tests/world-art.spec.ts
      - src/frontend/src/pages/PortalChallengesPage.tsx
      - src/frontend/tests/portal-console.spec.ts
      - src/frontend/src/pages/InventoryPage.tsx
      - src/frontend/tests/inventory-browse.spec.ts
      - src/frontend/src/pages/CharacterEditorPage.tsx
      - src/frontend/tests/character-studio.spec.ts
      - src/frontend/src/i18n.ts

permissions:
  contents: read

jobs:
  screenshots:
    # Avoid ubuntu-latest 26.04 migration and apt DNS during screenshot setup.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm install
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - name: Capture viewport screenshot matrix (fixture data only)
        env:
          CI: "true"
          VITE_BASE_PATH: /Vuxo/
          VUXO_VISUAL_REVIEW: "1"
        run: npx playwright test tests/ux-visual-review.spec.ts tests/world-art.spec.ts tests/world-portals.spec.ts tests/auth.spec.ts --workers=1
      - name: Upload screenshots and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-visual-evidence
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          retention-days: 14
          if-no-files-found: warn
