name: Public API edge sampling (read-only)

on:
  workflow_dispatch:
  # Capture evidence when this diagnostic changes; never run on a timer:
  # Actions quota/billing #168 is unresolved and daily builds are not required.
  push:
    branches: [main]
    paths:
      - .github/workflows/public-edge-sampling.yml
      - scripts/sample-public-edge.mjs
      - scripts/sample-public-edge.test.mjs
      - scripts/verify-public-auth.mjs

permissions:
  contents: read

jobs:
  sample-public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Validate offline sampling redaction and strict status expectations
        run: node --test scripts/verify-public-auth.test.mjs scripts/sample-public-edge.test.mjs
      - name: Read-only public edge route sample (three rounds)
        env:
          VUXO_EDGE_SAMPLE_OUTPUT: vuxo-public-edge-samples.json
        run: node scripts/sample-public-edge.mjs
      - name: Retain only sanitized route status and POP observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vuxo-public-edge-evidence
          path: vuxo-public-edge-samples.json
          retention-days: 7
          if-no-files-found: warn
