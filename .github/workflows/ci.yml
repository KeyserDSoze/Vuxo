name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Keep only the latest push/PR check per ref. Distinct groups preserve
# CI, real-DB E2E, and visual evidence as independent acceptance gates.
# This limits superseded runner work, not GitHub billing/platform failures.
concurrency:
  group: vuxo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate Raspberry Pi 3 ARM64 Compose and deploy contracts
        run: bash scripts/test-pi3-compose.sh
      - name: Validate private local Docker development Compose overlay
        shell: bash
        run: |
          node scripts/dev.mjs init
          docker compose --project-name vuxo-dev --env-file docker/.env.local \
            -f docker/compose.dev.yml -f docker/compose.dev-app.yml config --quiet
      - name: Validate observability compose overlay
        shell: bash
        run: |
          export VUXO_API_IMAGE=vuxo-api:test
          export VUXO_POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export VUXO_JWT_SIGNING_KEY="$(openssl rand -hex 32)"
          export VUXO_ALLOWED_ORIGIN=http://localhost
          export VUXO_GRAFANA_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          docker compose -f docker/compose.prod.yml -f docker/compose.observability.yml config >/dev/null
      - name: Validate production collector config
        run: |
          docker run -d --name vuxo-otel-config \
            -p 13134:13133 \
            -v "$PWD/docker/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.161.0 \
            --config=/etc/otelcol-contrib/config.yaml
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:13134/ >/dev/null; then
              docker rm -f vuxo-otel-config >/dev/null
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -q '^vuxo-otel-config$'; then
              docker logs vuxo-otel-config
              exit 1
            fi
            sleep 1
          done
          docker logs vuxo-otel-config
          exit 1
      - name: Start OTLP smoke collector
        run: |
          docker run -d --name vuxo-otel-smoke \
            -p 4317:4317 \
            -p 13133:13133 \
            -v "$PWD/docker/observability/otel-collector.smoke.yml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.161.0 \
            --config=/etc/otelcol-contrib/config.yaml
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:13133/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs vuxo-otel-smoke
          exit 1
      - name: Start PostgreSQL integration database
        run: |
          docker run -d --name vuxo-postgres-integration \
            -e POSTGRES_USER=vuxo \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1::5432 \
            postgres:17-alpine
          # Each hosted runner receives a free, loopback-only TCP port. A
          # fixed host port can collide with other test infrastructure.
          binding="$(docker port vuxo-postgres-integration 5432/tcp)"
          port="${binding##*:}"
          if [[ "$binding" != 127.0.0.1:* || ! "$port" =~ ^[0-9]{2,5}$ ]]; then
            echo "::error::Invalid PostgreSQL loopback port allocation"
            exit 1
          fi
          echo "VUXO_TEST_POSTGRES_CONNECTION_STRING=Host=127.0.0.1;Port=$port;Database=postgres;Username=vuxo;Pooling=false;Include Error Detail=true" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if docker exec vuxo-postgres-integration pg_isready -U vuxo -d postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs vuxo-postgres-integration
          exit 1
      - name: Restore
        run: dotnet restore Vuxo.sln
      - name: Build
        run: dotnet build Vuxo.sln -c Release --no-restore -p:VersionPrefix=$(cat VERSION) -p:SourceRevisionId=${GITHUB_SHA}
      - name: Test
        env:
          Observability__OtlpEndpoint: http://127.0.0.1:4317
        run: dotnet test Vuxo.sln -c Release --no-build --logger trx --results-directory TestResults
      - name: Verify PostgreSQL backup and restore tooling
        run: |
          docker exec vuxo-postgres-integration createdb -U vuxo vuxo_backup_source
          docker exec vuxo-postgres-integration psql -U vuxo -d vuxo_backup_source -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE backup_marker (id integer PRIMARY KEY, value text NOT NULL);" \
            -c "INSERT INTO backup_marker(id, value) VALUES (1, 'persisted-through-backup');" >/dev/null
          docker exec vuxo-postgres-integration pg_dump -U vuxo -d vuxo_backup_source --format=custom --file=/tmp/vuxo-backup.dump
          # Verify the same host-side streaming archive path used by the Pi
          # before any restore or API migration. A fake nonempty dump is rejected.
          docker cp vuxo-postgres-integration:/tmp/vuxo-backup.dump "$RUNNER_TEMP/vuxo-backup-ci.dump"
          docker exec -i vuxo-postgres-integration pg_restore --list < "$RUNNER_TEMP/vuxo-backup-ci.dump" >/dev/null
          printf 'NOT_A_PG_DUMP' > "$RUNNER_TEMP/vuxo-corrupt-ci.dump"
          if docker exec -i vuxo-postgres-integration pg_restore --list < "$RUNNER_TEMP/vuxo-corrupt-ci.dump" >/dev/null 2>&1; then
            echo "::error::Corrupt PostgreSQL archive was wrongly accepted"
            exit 1
          fi
          (
            cd "$RUNNER_TEMP"
            sha256sum -- vuxo-backup-ci.dump > vuxo-backup-ci.dump.sha256
            sha256sum --check --status vuxo-backup-ci.dump.sha256
          )
          printf 'TAMPER' >> "$RUNNER_TEMP/vuxo-backup-ci.dump"
          if (cd "$RUNNER_TEMP" && sha256sum --check --status vuxo-backup-ci.dump.sha256); then
            echo "::error::Tampered backup unexpectedly passed its checksum"
            exit 1
          fi
          docker exec vuxo-postgres-integration createdb -U vuxo vuxo_backup_restore
          docker exec vuxo-postgres-integration pg_restore -U vuxo -d vuxo_backup_restore --exit-on-error /tmp/vuxo-backup.dump
          restored="$(docker exec vuxo-postgres-integration psql -U vuxo -d vuxo_backup_restore -Atc "SELECT value FROM backup_marker WHERE id = 1;" | tr -d '\r')"
          test "$restored" = "persisted-through-backup"
      - name: Verify OTLP exporter smoke
        run: |
          sleep 3
          docker logs vuxo-otel-smoke 2>&1 | grep -q "vuxo-api"
      - name: Stop backend integration containers
        if: always()
        run: |
          docker rm -f vuxo-postgres-integration || true
          docker rm -f vuxo-otel-smoke || true

  devex-linux-runtime:
    name: DevEx Linux Docker + host CLI (#45)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Create safe ephemeral local configuration
        run: node scripts/dev.mjs init
      - name: Boot real ASP.NET + PostgreSQL + Redis + Vite through cross-platform CLI
        timeout-minutes: 19
        run: node scripts/dev.mjs up
      - name: Check ASP.NET health, CORS discovery and Vite HTML over loopback
        timeout-minutes: 2
        run: node scripts/dev-smoke.mjs
      - name: Smoke local OpenTelemetry collector explicitly opted in
        timeout-minutes: 9
        run: |
          node scripts/dev.mjs up --observability
          node scripts/dev-smoke.mjs
          node scripts/dev-otel-smoke.mjs
      - name: Stop Docker application before testing host IDE debug
        run: node scripts/dev.mjs down
      - name: Smoke native .NET/Vite debug with local OTLP collector and PostgreSQL
        timeout-minutes: 10
        run: node scripts/dev-host-smoke.mjs debug-observability
      - name: Run coordinated CLI test with real PostgreSQL xUnit + Playwright
        timeout-minutes: 19
        run: node scripts/dev.mjs test
      - name: Inspect local container status on failure (no secrets)
        if: failure()
        shell: bash
        run: |
          docker compose --project-name vuxo-dev --env-file docker/.env.local \
            -f docker/compose.dev.yml -f docker/compose.dev-app.yml ps || true
      - name: Stop local stack without deleting volumes
        if: always()
        run: node scripts/dev.mjs down

  devex-windows-contract:
    name: DevEx Windows CLI + native Vite (#45)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test cross-platform CLI contracts on Windows Node
        run: node --test scripts/dev.test.mjs scripts/dev-process-tree.test.mjs
      - name: Run genuine private bootstrap on Windows and reject overwrite
        shell: pwsh
        run: |
          node scripts/dev.mjs init
          if ($LASTEXITCODE -ne 0) { throw 'CLI init failed' }
          if (-not (Test-Path 'docker/.env.local')) { throw 'No private env generated' }
          git check-ignore -q docker/.env.local
          if ($LASTEXITCODE -ne 0) { throw 'Private env is not gitignored' }
          node scripts/dev.mjs init
          if ($LASTEXITCODE -eq 0) { throw 'CLI init overwrote existing private env' }
          node scripts/dev.mjs help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help failed' }
      - name: Install real frontend dependencies natively on Windows
        working-directory: src/frontend
        run: npm install --no-audit --no-fund
      - name: Smoke native Windows npm.cmd/Vite and loopback HTML
        timeout-minutes: 8
        run: node scripts/dev-host-smoke.mjs frontend

  docker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production-like Docker runtime smoke
        run: bash scripts/test-docker-runtime.sh

  frontend:
    # Ubuntu 26 migration can pull apt fonts over flaky DNS before any browser test.
    # Pin 24.04 and verify the real Chromium browser without apt provisioning.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release metadata
        run: node ../../scripts/verify-release-metadata.mjs
      - name: Verify repository foundation
        run: node ../../scripts/verify-repository-foundation.mjs
      - name: Verify project governance
        run: node ../../scripts/verify-governance.mjs
      - name: Test .NET security dependency and container baseline (offline)
        run: node --test ../../scripts/test-dotnet-security-baseline.test.mjs
      - name: Test browser runner and Chromium install contracts (offline)
        run: node --test ../../scripts/test-browser-runner-contract.test.mjs ../../scripts/test-workflow-release-guards.test.mjs
      - name: Test local cross-platform dev CLI contracts (offline)
        run: node --test ../../scripts/dev.test.mjs ../../scripts/dev-process-tree.test.mjs
      - name: Install dependencies
        run: npm install
      - name: Test public auth, history isolation and CORS (offline)
        run: node --test ../../scripts/verify-public-auth.test.mjs
      - name: Test repeatable public edge sampling and redaction (offline)
        run: node --test ../../scripts/sample-public-edge.test.mjs
      - name: Test GitHub Pages release contracts (offline)
        run: node --test ../../scripts/verify-pages-artifact.test.mjs
      - name: Test definitive production domain contracts (offline)
        run: node --test ../../scripts/test-production-domain.test.mjs
      - name: Test Google GIS initialization lifecycle contract (offline)
        run: node --test ../../scripts/test-google-gis-lifecycle.test.mjs
      - name: Test Microsoft popup user-gesture lifecycle contract (offline)
        run: node --test ../../scripts/test-microsoft-popup-contract.test.mjs
      - name: Build
        env:
          VITE_BASE_PATH: /Vuxo/
        run: npm run build
      - name: Verify built frontend metadata
        run: node ../../scripts/verify-built-version.mjs
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Playwright
        env:
          VITE_BASE_PATH: /Vuxo/
        run: npm run test:e2e
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-diagnostics
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
