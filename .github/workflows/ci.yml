name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Vuxo.sln
      - name: Build
        run: dotnet build Vuxo.sln -c Release --no-restore -p:VersionPrefix=$(cat VERSION) -p:SourceRevisionId=${GITHUB_SHA}
      - name: Test
        run: dotnet test Vuxo.sln -c Release --no-build --logger trx --results-directory TestResults

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release metadata
        run: node ../../scripts/verify-release-metadata.mjs
      - name: Verify project governance
        run: node ../../scripts/verify-governance.mjs
      - name: Install dependencies
        run: npm install
      - name: Build
        env:
          VITE_BASE_PATH: /Vuxo/
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        env:
          VITE_BASE_PATH: /Vuxo/
        run: npm run test:e2e
