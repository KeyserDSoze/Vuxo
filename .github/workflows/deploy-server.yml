name: Deploy backend to self-hosted server

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - 'docker/**'
      - 'Directory.Build.props'
      - 'VERSION'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test backend
        run: dotnet test Vuxo.sln -c Release
      - name: Compute image name
        id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vuxo-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ghcr.io/keyserdsoze/vuxo-api:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, vuxo-prod]
    environment: production
    concurrency:
      group: vuxo-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify required production secrets
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.VUXO_POSTGRES_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.VUXO_JWT_SIGNING_KEY }}
          CLOUDFLARE_TOKEN: ${{ secrets.VUXO_CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$POSTGRES_PASSWORD" ]] || { echo "VUXO_POSTGRES_PASSWORD is missing" >&2; exit 1; }
          [[ -n "$JWT_SIGNING_KEY" ]] || { echo "VUXO_JWT_SIGNING_KEY is missing" >&2; exit 1; }
          [[ -n "$CLOUDFLARE_TOKEN" ]] || { echo "VUXO_CLOUDFLARE_TUNNEL_TOKEN is missing" >&2; exit 1; }
      - name: Write runtime environment
        shell: bash
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.image }}
          POSTGRES_PASSWORD: ${{ secrets.VUXO_POSTGRES_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.VUXO_JWT_SIGNING_KEY }}
          CLOUDFLARE_TOKEN: ${{ secrets.VUXO_CLOUDFLARE_TUNNEL_TOKEN }}
          ALLOWED_ORIGIN: ${{ vars.VUXO_ALLOWED_ORIGIN || 'https://vuxo.quest' }}
          LLM_MODEL: ${{ vars.VUXO_LLM_MODEL || 'qwen3:1.7b' }}
        run: |
          umask 077
          cat > /tmp/vuxo.env <<EOF
          VUXO_API_IMAGE=${API_IMAGE}
          VUXO_POSTGRES_DB=vuxo
          VUXO_POSTGRES_USER=vuxo
          VUXO_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          VUXO_JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
          VUXO_ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
          VUXO_CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
          VUXO_LLM_MODEL=${LLM_MODEL}
          VUXO_COMMIT_SHA=${GITHUB_SHA}
          VUXO_BUILD_DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
      - name: Validate production compose
        run: docker compose --env-file /tmp/vuxo.env -f docker/compose.prod.yml --profile edge config --quiet
      - name: Pull and replace containers
        run: |
          docker compose --env-file /tmp/vuxo.env -f docker/compose.prod.yml --profile edge pull
          docker compose --env-file /tmp/vuxo.env -f docker/compose.prod.yml --profile edge up -d --remove-orphans
      - name: Verify local API health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file /tmp/vuxo.env -f docker/compose.prod.yml logs api --tail 200
          exit 1
      - name: Verify reboot persistence policies
        shell: bash
        run: |
          set -euo pipefail
          for service in api postgres redis ollama cloudflared; do
            container_id="$(docker compose --env-file /tmp/vuxo.env -f docker/compose.prod.yml --profile edge ps -q "$service")"
            [[ -n "$container_id" ]] || { echo "Container for $service is missing" >&2; exit 1; }
            restart_policy="$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$container_id")"
            [[ "$restart_policy" == "unless-stopped" ]] || {
              echo "$service restart policy is '$restart_policy', expected 'unless-stopped'" >&2
              exit 1
            }
            running="$(docker inspect --format '{{.State.Running}}' "$container_id")"
            [[ "$running" == "true" ]] || { echo "$service is not running" >&2; exit 1; }
          done
      - name: Verify Cloudflare public tunnel
        shell: bash
        env:
          PUBLIC_API_URL: ${{ vars.VUXO_PUBLIC_API_URL || 'https://api.vuxoapi.xyz' }}
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "${PUBLIC_API_URL}/health" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file /tmp/vuxo.env -f docker/compose.prod.yml --profile edge logs cloudflared --tail 200
          exit 1
      - name: Remove transient env file
        if: always()
        run: rm -f /tmp/vuxo.env
