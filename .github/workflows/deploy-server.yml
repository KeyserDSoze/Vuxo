name: Deploy backend to self-hosted server

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - 'docker/**'
      - 'Directory.Build.props'
      - 'VERSION'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Legacy x64 deploy is opt-in. Pi 3 ARM64 uses deploy-pi3.yml instead.
    # This prevents an accidental second production deployment during migration.
    if: vars.VUXO_X64_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test backend
        run: dotnet test Vuxo.sln -c Release
      - name: Compute image name
        id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vuxo-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ghcr.io/keyserdsoze/vuxo-api:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, vuxo-prod]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write runtime environment
        shell: bash
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.image }}
          POSTGRES_PASSWORD: ${{ secrets.VUXO_POSTGRES_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.VUXO_JWT_SIGNING_KEY }}
          CLOUDFLARE_TOKEN: ${{ secrets.VUXO_CLOUDFLARE_TUNNEL_TOKEN }}
          # The canonical browser origin is fixed at deploy time, even if a
          # legacy GitHub environment variable still contains vuxo.app.
          ALLOWED_ORIGIN: https://vuxo.quest
          LLM_MODEL: ${{ vars.VUXO_LLM_MODEL || 'qwen3:1.7b' }}
          LLM_MAX_TOOL_ROUNDS: ${{ vars.VUXO_LLM_MAX_TOOL_ROUNDS || '2' }}
          LLM_MAX_RETRIES: ${{ vars.VUXO_LLM_MAX_RETRIES || '1' }}
          LLM_RETRY_DELAY_MILLISECONDS: ${{ vars.VUXO_LLM_RETRY_DELAY_MILLISECONDS || '100' }}
          LLM_CIRCUIT_FAILURE_THRESHOLD: ${{ vars.VUXO_LLM_CIRCUIT_FAILURE_THRESHOLD || '3' }}
          LLM_CIRCUIT_BREAK_SECONDS: ${{ vars.VUXO_LLM_CIRCUIT_BREAK_SECONDS || '30' }}
          JWT_LIFETIME_MINUTES: ${{ vars.VUXO_JWT_LIFETIME_MINUTES || '480' }}
          MICROSOFT_CLIENT_ID: ${{ vars.VUXO_MICROSOFT_CLIENT_ID }}
          # VUXO supports personal Microsoft accounts only; do not use
          # a stale tenant GUID or 'common' from GitHub variables.
          MICROSOFT_TENANT_ID: consumers
          GOOGLE_CLIENT_ID: ${{ vars.VUXO_GOOGLE_CLIENT_ID }}
        run: |
          umask 077
          cat > /tmp/vuxo.env <<EOF
          VUXO_API_IMAGE=${API_IMAGE}
          VUXO_POSTGRES_DB=vuxo
          VUXO_POSTGRES_USER=vuxo
          VUXO_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          VUXO_JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
          VUXO_JWT_LIFETIME_MINUTES=${JWT_LIFETIME_MINUTES}
          VUXO_MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
          VUXO_MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID}
          VUXO_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          VUXO_ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
          VUXO_CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
          VUXO_LLM_MODEL=${LLM_MODEL}
          VUXO_LLM_MAX_TOOL_ROUNDS=${LLM_MAX_TOOL_ROUNDS}
          VUXO_LLM_MAX_RETRIES=${LLM_MAX_RETRIES}
          VUXO_LLM_RETRY_DELAY_MILLISECONDS=${LLM_RETRY_DELAY_MILLISECONDS}
          VUXO_LLM_CIRCUIT_FAILURE_THRESHOLD=${LLM_CIRCUIT_FAILURE_THRESHOLD}
          VUXO_LLM_CIRCUIT_BREAK_SECONDS=${LLM_CIRCUIT_BREAK_SECONDS}
          VUXO_COMMIT_SHA=${GITHUB_SHA}
          VUXO_BUILD_DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
      - name: Pull and replace containers
        run: |
          docker compose --env-file /tmp/vuxo.env -f docker/compose.prod.yml --profile edge pull
          docker compose --env-file /tmp/vuxo.env -f docker/compose.prod.yml --profile edge up -d --remove-orphans
      - name: Verify health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file /tmp/vuxo.env -f docker/compose.prod.yml logs api --tail 200
          exit 1
      - name: Remove transient env file
        if: always()
        run: rm -f /tmp/vuxo.env
