services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${VUXO_POSTGRES_DB:-vuxo}
      POSTGRES_USER: ${VUXO_POSTGRES_USER:-vuxo}
      POSTGRES_PASSWORD: ${VUXO_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - vuxo-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VUXO_POSTGRES_USER:-vuxo} -d ${VUXO_POSTGRES_DB:-vuxo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - vuxo-redis-dev:/data

volumes:
  vuxo-postgres-dev:
  vuxo-redis-dev:
