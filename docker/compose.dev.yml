services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${VUXO_POSTGRES_DB:-vuxo}
      POSTGRES_USER: ${VUXO_POSTGRES_USER:-vuxo}
      POSTGRES_PASSWORD: ${VUXO_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - vuxo-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VUXO_POSTGRES_USER:-vuxo} -d ${VUXO_POSTGRES_DB:-vuxo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - vuxo-redis-dev:/data

  ollama:
    image: ${VUXO_OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: ${VUXO_OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_MAX_LOADED_MODELS: ${VUXO_OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${VUXO_OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_QUEUE: ${VUXO_OLLAMA_MAX_QUEUE:-16}
      OLLAMA_KEEP_ALIVE: ${VUXO_OLLAMA_KEEP_ALIVE:-2m}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - vuxo-ollama-dev:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-model-init:
    image: ${VUXO_OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${VUXO_LLM_MODEL:-qwen3:1.7b}"]
    restart: "no"

volumes:
  vuxo-postgres-dev:
  vuxo-redis-dev:
  vuxo-ollama-dev:
